name: Setup

on:
  workflow_dispatch:

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

# Setup and Teardown share this group so two Terraform runs never touch the state at once.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: Validate and deploy infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Terraform 1.10.5
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (S3 remote state)
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Show Terraform outputs
        id: outputs
        run: |
          terraform output
          url="$(terraform output -raw frontend_website_url)"
          echo "frontend_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment complete"
            echo
            echo "### Frontend website: $url"
            echo
            echo "#### All Terraform outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test frontend (expect HTTP 200)
        env:
          URL: ${{ steps.outputs.outputs.frontend_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)"
            echo "Attempt $attempt: HTTP $status from $URL"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL did not return HTTP 200 after 6 attempts"
          exit 1
