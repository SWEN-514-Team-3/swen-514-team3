name: Setup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing your AWS credentials and state key
        type: environment
        required: true
      action:
        description: Preview changes or deploy infrastructure
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      LAMBDA_PERMISSIONS_BOUNDARY_ARN: ${{ vars.LAMBDA_PERMISSIONS_BOUNDARY_ARN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check deployment settings
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION variable'; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo 'Missing TF_STATE_BUCKET variable'; exit 1; }
          test -n "$TF_STATE_KEY" || { echo 'Missing TF_STATE_KEY environment secret'; exit 1; }
          if [ -n "$LAMBDA_PERMISSIONS_BOUNDARY_ARN" ]; then
            printf 'TF_VAR_lambda_permissions_boundary_arn=%s\n' "$LAMBDA_PERMISSIONS_BOUNDARY_ARN" >> "$GITHUB_ENV"
          fi

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infrastructure
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=$AWS_REGION"

      - name: Terraform validate
        working-directory: infrastructure
        run: terraform validate

      - name: Build database setup package
        run: bash lambda/db_init/build.sh

      - name: Terraform plan
        working-directory: infrastructure
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: infrastructure
        run: terraform apply -input=false tfplan

      - name: Terraform output
        if: inputs.action == 'apply'
        working-directory: infrastructure
        run: terraform output

      # The database is private, so seed it through the db-init Lambda (it runs
      # inside the VPC). The login is read here and passed in the invoke call.
      - name: Create tables and load sample data
        if: inputs.action == 'apply'
        working-directory: infrastructure
        shell: bash
        run: |
          set -euo pipefail
          FUNCTION_NAME="$(terraform output -raw db_init_function_name)"
          SECRET_ARN="$(terraform output -raw db_secret_arn)"
          SECRET="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text)"
          echo "::add-mask::$(jq -r .password <<< "$SECRET")"
          jq -c '{username, password}' <<< "$SECRET" > "$RUNNER_TEMP/db-login.json"
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 150 \
            --payload "file://$RUNNER_TEMP/db-login.json" \
            "$RUNNER_TEMP/db-init-result.json" > "$RUNNER_TEMP/db-init-meta.json"
          rm -f "$RUNNER_TEMP/db-login.json"
          cat "$RUNNER_TEMP/db-init-result.json"; echo
          if jq -e '.FunctionError' "$RUNNER_TEMP/db-init-meta.json" > /dev/null; then
            echo 'Database setup failed'
            exit 1
          fi
