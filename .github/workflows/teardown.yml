name: Teardown

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete all Terraform-managed infrastructure'
        required: true
        type: string

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

# Setup and Teardown share this group so two Terraform runs never touch the state at once.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Destroy infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Confirm destroy
        working-directory: . # runs before checkout, so infrastructure/ does not exist yet
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Teardown cancelled: the confirm input must be exactly \"destroy\"."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Terraform 1.10.5
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init (S3 remote state)
        run: terraform init

      - name: Terraform destroy
        run: terraform destroy -auto-approve

      - name: Write job summary
        run: |
          echo "## Teardown complete: all Terraform-managed resources destroyed" >> "$GITHUB_STEP_SUMMARY"
