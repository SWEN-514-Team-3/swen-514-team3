name: Teardown

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment used for Setup
        type: environment
        required: true
      confirm:
        description: 'Type "destroy" to delete this environment'
        type: string
        required: true
      recover_api_lambda:
        description: 'Recovery only: existing API Lambda name missing from this state (otherwise leave empty)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: inputs.confirm == 'destroy'
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      LAMBDA_PERMISSIONS_BOUNDARY_ARN: ${{ vars.LAMBDA_PERMISSIONS_BOUNDARY_ARN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check deployment settings
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION variable'; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo 'Missing TF_STATE_BUCKET variable'; exit 1; }
          test -n "$TF_STATE_KEY" || { echo 'Missing TF_STATE_KEY environment secret'; exit 1; }
          if [ -n "$LAMBDA_PERMISSIONS_BOUNDARY_ARN" ]; then
            printf 'TF_VAR_lambda_permissions_boundary_arn=%s\n' "$LAMBDA_PERMISSIONS_BOUNDARY_ARN" >> "$GITHUB_ENV"
          fi

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: infrastructure
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=$TF_STATE_KEY"
          -backend-config="region=$AWS_REGION"

      - name: Recover untracked API Lambda into state
        if: inputs.recover_api_lambda != ''
        working-directory: infrastructure
        env:
          RECOVER_API_LAMBDA: ${{ inputs.recover_api_lambda }}
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}'
          aws lambda get-function-configuration \
            --function-name "$RECOVER_API_LAMBDA" \
            --query '{Name:FunctionName,Arn:FunctionArn,VpcConfig:VpcConfig}'
          terraform state pull > "$RUNNER_TEMP/state-before-lambda-recovery.json"
          terraform state list > "$RUNNER_TEMP/recovery-state-addresses.txt"
          if grep -Fxq 'aws_lambda_function.api' "$RUNNER_TEMP/recovery-state-addresses.txt"; then
            echo 'API Lambda is already tracked; refusing an unnecessary recovery import.'
            exit 1
          fi
          terraform import -input=false aws_lambda_function.api "$RECOVER_API_LAMBDA"

      - name: Terraform destroy
        working-directory: infrastructure
        run: terraform destroy -input=false -auto-approve
